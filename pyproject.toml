[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-monitor-public"
version = "0.1.0"
description = "Sanitized public blueprint for an ecommerce listing monitoring workflow."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Rulan Lai" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
